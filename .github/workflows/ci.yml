name: CI

# Lint, test, type-check, build and validate on every push and pull request.
# No AWS credentials and no deploy step: the backend runs against moto, the frontend against
# mocked API responses.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12" # same as the Lambda runtime
  NODE_VERSION: "24"
  AWS_DEFAULT_REGION: ap-south-1

jobs:
  backend:
    name: Backend (ruff + pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Run tests
        run: >
          pytest --cov --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90 --junitxml=test-results.xml
      - name: Test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          cov = ET.parse("coverage.xml").getroot()
          tests = ET.parse("test-results.xml").getroot()
          suite = tests if tests.tag == "testsuite" else tests[0]
          print("### Backend tests")
          print(f"- Tests: {suite.get('tests')}, failures: {suite.get('failures')}, "
                f"errors: {suite.get('errors')}, skipped: {suite.get('skipped')}")
          print(f"- Line coverage of the Lambda code: {float(cov.get('line-rate')) * 100:.1f}%")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/coverage.xml
            backend/test-results.xml

  frontend:
    name: Frontend (oxlint + tsc + vitest + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle summary
        run: |
          {
            echo "### Frontend build"
            echo '```'
            ls -l dist/assets | awk 'NR>1 {printf "%-40s %8.1f KB\n", $9, $5/1024}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  template:
    name: Template (cfn-lint + sam validate + sam build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "cfn-lint>=1.0"
      - name: cfn-lint
        run: cfn-lint template.yaml
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: sam validate --lint
        run: sam validate --lint --template-file template.yaml
      - name: sam build (all three functions, no Docker)
        run: sam build --template-file template.yaml
