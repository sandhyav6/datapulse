AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless ETL & Data Quality Platform - S3 -> SQS -> Lambda -> S3 + DynamoDB, with a DLQ,
  idempotent job claims, CloudWatch alarms/dashboard and (V2) Parquet + Glue + Athena.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9]{1,10}$"
    Description: Suffix for resource names so several stages can coexist.
  AlertEmail:
    Type: String
    Default: ""
    Description: Email that receives alarm notifications (confirm the subscription email). Empty = no subscription.
  EnableAnalytics:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: V2 - write Parquet to curated/, create the Glue catalog and Athena workgroup.
  PandasLayerArn:
    Type: String
    # Source: https://aws-sdk-pandas.readthedocs.io/en/stable/layers.html (v3.17.1, python3.12 arm64, ap-south-1)
    Default: arn:aws:lambda:ap-south-1:336392948345:layer:AWSSDKPandas-Python312-Arm64:31
    Description: AWS-managed "AWS SDK for pandas" layer (provides pyarrow); used only when EnableAnalytics=true.
  MaxReceiveCount:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Deliveries before a message moves to the DLQ (the handler marks the job FAILED on the last one).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  AnalyticsEnabled: !Equals [!Ref EnableAnalytics, "true"]

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    DependsOn: JobQueuePolicy # S3 validates it can send to the queue when the notification is created
    Properties:
      BucketName: !Sub etl-pipeline-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-rejected
            Status: Enabled
            Prefix: rejected/
            ExpirationInDays: 30
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 30
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
          - Id: expire-noncurrent-and-incomplete
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt JobQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
                  - Name: suffix
                    Value: .csv

  # ---------------------------------------------------------------- queueing
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub etl-jobs-${Stage}
      VisibilityTimeout: 360 # >= 6x the 60 s Lambda timeout (AWS guidance for SQS event sources)
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDLQ.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  JobDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub etl-jobs-dlq-${Stage}
      MessageRetentionPeriod: 1209600 # 14 days to inspect and redrive
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:etl-jobs-${Stage}

  JobQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JobQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3BucketNotifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt JobQueue.Arn
            Condition:
              ArnLike:
                # Built with !Sub, not !GetAtt DataBucket.Arn, to avoid a circular dependency.
                aws:SourceArn: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------- job state
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub etl-jobs-${Stage}
      BillingMode: PROVISIONED # 5+5 RCU/WCU stays inside the always-free 25/25
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: started_at
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: started_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: false # AWS-owned key encryption (free) is always on

  # ---------------------------------------------------------------- compute
  EtlProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/etl-processor-${Stage}
      RetentionInDays: 14 # default is "never expire", which slowly costs money

  EtlProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      Description: etl-processor - reads raw/, writes output prefixes, owns job items. Nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: etl-processor-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/etl-processor-${Stage}:*
              - Sid: PollJobQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt JobQueue.Arn
              - Sid: ReadRawOnly
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion # jobs read the exact version named in the S3 event
                Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/raw/*
              - Sid: WriteOutputsOnly
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/processed/*
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/rejected/*
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/reports/*
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/curated/*
              - Sid: OwnJobItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem # claims and state changes are conditional UpdateItems
                Resource: !GetAtt JobsTable.Arn

  EtlProcessorFunction:
    Type: AWS::Serverless::Function
    DependsOn: EtlProcessorLogGroup
    Properties:
      FunctionName: !Sub etl-processor-${Stage}
      Description: Validates, cleans and reports on CSV files dropped in raw/<dataset>/
      CodeUri: src/
      Handler: etl_processor.app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt EtlProcessorRole.Arn
      Layers: !If [AnalyticsEnabled, [!Ref PandasLayerArn], !Ref AWS::NoValue]
      Environment:
        Variables:
          BUCKET_NAME: !Sub etl-pipeline-${AWS::AccountId}-${AWS::Region}
          TABLE_NAME: !Ref JobsTable
          SCHEMA_DIR: /var/task/schemas
          OUTPUT_FORMAT: !If [AnalyticsEnabled, both, csv]
          MAX_RECEIVE_COUNT: !Ref MaxReceiveCount
      Events:
        JobQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2 # caps parallelism without reserved concurrency

  # ---------------------------------------------------------------- alerts & monitoring
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub etl-pipeline-alerts-${Stage}
      DisplayName: ETL pipeline alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub etl-${Stage}-lambda-errors
      AlarmDescription: etl-processor crashed (timeout, OOM, init error or unhandled exception).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EtlProcessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub etl-${Stage}-dlq-not-empty
      AlarmDescription: A message exhausted its retries and is in the DLQ - a job FAILED.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub etl-${Stage}-queue-stuck
      AlarmDescription: The oldest job has waited over 10 minutes - the pipeline is stuck or throttled.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  PipelineDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub etl-pipeline-${Stage}
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
               "properties": {"markdown": "## Serverless ETL pipeline (${Stage})\nS3 raw/ → SQS ${QueueName} → Lambda ${FunctionName} → S3 outputs + DynamoDB ${JobsTable}. DLQ: ${DlqName}."}},
              {"type": "metric", "x": 0, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "Lambda invocations / errors / throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                 "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${FunctionName}"],
                             [".", "Errors", ".", "."],
                             [".", "Throttles", ".", "."]]}},
              {"type": "metric", "x": 8, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "Lambda duration p95 (ms)", "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                 "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${FunctionName}", {"stat": "p95"}],
                             ["...", {"stat": "Average"}]]}},
              {"type": "metric", "x": 16, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "Concurrent executions (capped at 2)", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                 "metrics": [["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${FunctionName}"]]}},
              {"type": "metric", "x": 0, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "Queue depth", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                 "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${QueueName}"],
                             [".", "ApproximateNumberOfMessagesNotVisible", ".", "."]]}},
              {"type": "metric", "x": 8, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "DLQ depth", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                 "annotations": {"horizontal": [{"label": "alarm", "value": 1}]},
                 "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DlqName}"]]}},
              {"type": "metric", "x": 16, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "Age of oldest message (s)", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                 "annotations": {"horizontal": [{"label": "alarm", "value": 600}]},
                 "metrics": [["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${QueueName}"]]}},
              {"type": "metric", "x": 0, "y": 14, "width": 8, "height": 6,
               "properties": {"title": "Rows accepted vs rejected", "region": "${AWS::Region}", "period": 300, "view": "timeSeries", "stacked": true,
                 "metrics": [[{"expression": "SEARCH('{EtlPipeline,Dataset} MetricName=\"RowsAccepted\"', 'Sum', 300)", "id": "accepted", "label": "accepted"}],
                             [{"expression": "SEARCH('{EtlPipeline,Dataset} MetricName=\"RowsRejected\"', 'Sum', 300)", "id": "rejected", "label": "rejected"}]]}},
              {"type": "metric", "x": 8, "y": 14, "width": 8, "height": 6,
               "properties": {"title": "Job duration p95 (ms)", "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                 "metrics": [[{"expression": "SEARCH('{EtlPipeline,Dataset} MetricName=\"JobDurationMs\"', 'p95', 300)", "id": "duration", "label": "p95"}]]}},
              {"type": "metric", "x": 16, "y": 14, "width": 8, "height": 6,
               "properties": {"title": "Jobs failed", "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                 "metrics": [[{"expression": "SEARCH('{EtlPipeline,Dataset} MetricName=\"JobsFailed\"', 'Sum', 300)", "id": "failed", "label": "failed"}]]}},
              {"type": "log", "x": 0, "y": 20, "width": 24, "height": 8,
               "properties": {"title": "Recent jobs", "region": "${AWS::Region}", "view": "table",
                 "query": "SOURCE '${LogGroup}' | fields @timestamp, job_id, event, status, dataset, rows_accepted, rows_rejected, duration_ms, error_type | filter event in ['job_finished', 'job_failed', 'duplicate_delivery'] | sort @timestamp desc | limit 50"}}
            ]
          }
        - QueueName: !GetAtt JobQueue.QueueName
          DlqName: !GetAtt JobDLQ.QueueName
          FunctionName: !Ref EtlProcessorFunction
          LogGroup: !Ref EtlProcessorLogGroup

  RecentJobsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub etl-pipeline-${Stage}/recent-jobs
      LogGroupNames:
        - !Ref EtlProcessorLogGroup
      QueryString: |
        fields @timestamp, job_id, event, status, dataset, rows_total, rows_accepted, rows_rejected, duration_ms, attempt, error_type
        | filter event in ["job_finished", "job_failed", "duplicate_delivery"]
        | sort @timestamp desc
        | limit 50

  JobTraceQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub etl-pipeline-${Stage}/job-trace
      LogGroupNames:
        - !Ref EtlProcessorLogGroup
      QueryString: |
        fields @timestamp, event, stage, status, receive_count, attempt, error_type, error_message
        | filter job_id = "REPLACE_WITH_JOB_ID"
        | sort @timestamp asc

  # ---------------------------------------------------------------- dashboard identity
  DashboardReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub etl-dashboard-${Stage}
      Description: Streamlit dashboard - read job state/reports/outputs, upload to raw/, read queue depth. Never modifies outputs.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: QueryJobsByStatus
            Effect: Allow
            Action: dynamodb:Query
            Resource: !Sub ${JobsTable.Arn}/index/status-index
          - Sid: ReadReportsAndOutputs
            Effect: Allow
            Action: s3:GetObject
            Resource:
              - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/reports/*
              - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/processed/*
              - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/rejected/*
          - Sid: UploadRawOnly
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/raw/*
          - Sid: ReadQueueDepth
            Effect: Allow
            Action: sqs:GetQueueAttributes
            Resource:
              - !GetAtt JobQueue.Arn
              - !GetAtt JobDLQ.Arn
          - !If
            - AnalyticsEnabled
            - Sid: AthenaOnPipelineWorkgroup
              Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StopQueryExecution
                - athena:GetWorkGroup
              Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/etl-pipeline-${Stage}
            - !Ref AWS::NoValue
          - !If
            - AnalyticsEnabled
            - Sid: GlueCatalogRead
              Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:GetPartition
                - glue:GetPartitions
              Resource:
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/etl_pipeline_${Stage}
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/etl_pipeline_${Stage}/sales
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/etl_pipeline_${Stage}/sales_csv
            - !Ref AWS::NoValue
          - !If
            - AnalyticsEnabled
            - Sid: AthenaReadsDataAndWritesResults # Athena reads S3 with the caller's permissions
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/athena-results/*
            - !Ref AWS::NoValue
          - !If
            - AnalyticsEnabled
            - Sid: AthenaReadsCuratedData
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/curated/*
            - !Ref AWS::NoValue
          - !If
            - AnalyticsEnabled
            - Sid: AthenaListsQueriedPrefixes
              Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}
              Condition:
                StringLike:
                  s3:prefix:
                    - ""
                    - processed/*
                    - curated/*
                    - athena-results/*
            - !Ref AWS::NoValue

  # ---------------------------------------------------------------- V2 analytics (EnableAnalytics=true)
  GlueDatabase:
    Type: AWS::Glue::Database
    Condition: AnalyticsEnabled
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub etl_pipeline_${Stage}
        Description: Curated outputs of the serverless ETL pipeline

  SalesTable:
    Type: AWS::Glue::Table
    Condition: AnalyticsEnabled
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: sales
        Description: Clean sales rows as snappy Parquet. Partition projection - no crawler, no MSCK REPAIR.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          parquet.compression: SNAPPY
          projection.enabled: "true"
          projection.ingest_date.type: date
          projection.ingest_date.format: yyyy-MM-dd
          projection.ingest_date.range: 2026-01-01,NOW
          projection.ingest_date.interval: "1"
          projection.ingest_date.interval.unit: DAYS
          storage.location.template: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/curated/dataset=sales/ingest_date=${!ingest_date}/
        PartitionKeys:
          - Name: ingest_date
            Type: string
        StorageDescriptor:
          Location: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/curated/dataset=sales/
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: transaction_id, Type: string}
            - {Name: transaction_date, Type: date}
            - {Name: product_category, Type: string}
            - {Name: quantity, Type: bigint}
            - {Name: unit_price, Type: "decimal(18,2)"}
            - {Name: region, Type: string}
            - {Name: transaction_amount, Type: "decimal(18,2)"}

  SalesCsvTable:
    Type: AWS::Glue::Table
    Condition: AnalyticsEnabled
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: sales_csv
        Description: The same clean rows as CSV (processed/), kept to measure CSV vs Parquet bytes scanned.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.ingest_date.type: date
          projection.ingest_date.format: yyyy-MM-dd
          projection.ingest_date.range: 2026-01-01,NOW
          projection.ingest_date.interval: "1"
          projection.ingest_date.interval.unit: DAYS
          storage.location.template: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/processed/dataset=sales/ingest_date=${!ingest_date}/
        PartitionKeys:
          - Name: ingest_date
            Type: string
        StorageDescriptor:
          Location: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/processed/dataset=sales/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
          Columns:
            - {Name: transaction_id, Type: string}
            - {Name: transaction_date, Type: date}
            - {Name: product_category, Type: string}
            - {Name: quantity, Type: bigint}
            - {Name: unit_price, Type: "decimal(18,2)"}
            - {Name: region, Type: string}
            - {Name: transaction_amount, Type: "decimal(18,2)"}

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Condition: AnalyticsEnabled
    Properties:
      Name: !Sub etl-pipeline-${Stage}
      Description: ETL pipeline analytics - 100 MB per-query scan cap
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 104857600
        PublishCloudWatchMetricsEnabled: false
        ResultConfiguration:
          OutputLocation: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/athena-results/
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  MonthlyRevenueQuery:
    Type: AWS::Athena::NamedQuery
    Condition: AnalyticsEnabled
    Properties:
      Name: monthly-revenue
      WorkGroup: !Ref AthenaWorkgroup
      Database: !Ref GlueDatabase
      QueryString: >
        SELECT date_format(transaction_date, '%Y-%m') AS month, SUM(transaction_amount) AS revenue,
        COUNT(*) AS transactions FROM sales GROUP BY 1 ORDER BY 1

  TopCategoriesQuery:
    Type: AWS::Athena::NamedQuery
    Condition: AnalyticsEnabled
    Properties:
      Name: top-10-categories
      WorkGroup: !Ref AthenaWorkgroup
      Database: !Ref GlueDatabase
      QueryString: >
        SELECT product_category, SUM(transaction_amount) AS revenue, SUM(quantity) AS units
        FROM sales GROUP BY 1 ORDER BY revenue DESC LIMIT 10

  RegionByMonthQuery:
    Type: AWS::Athena::NamedQuery
    Condition: AnalyticsEnabled
    Properties:
      Name: region-by-month
      WorkGroup: !Ref AthenaWorkgroup
      Database: !Ref GlueDatabase
      QueryString: >
        SELECT region, date_format(transaction_date, '%Y-%m') AS month,
        SUM(transaction_amount) AS revenue FROM sales GROUP BY 1, 2 ORDER BY 2, 3 DESC

Outputs:
  BucketName:
    Value: !Ref DataBucket
  QueueUrl:
    Value: !Ref JobQueue
  DlqUrl:
    Value: !Ref JobDLQ
  TableName:
    Value: !Ref JobsTable
  FunctionName:
    Value: !Ref EtlProcessorFunction
  LogGroupName:
    Value: !Ref EtlProcessorLogGroup
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  DashboardPolicyArn:
    Description: Attach this to the etl-dashboard IAM user
    Value: !Ref DashboardReadPolicy
  CloudWatchDashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/etl-pipeline-${Stage}
  AthenaWorkgroupName:
    Condition: AnalyticsEnabled
    Value: !Ref AthenaWorkgroup
  GlueDatabaseName:
    Condition: AnalyticsEnabled
    Value: !Ref GlueDatabase
