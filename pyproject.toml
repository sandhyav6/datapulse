[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["etl_processor", "ingester", "data", "ui", "tests"]

[tool.coverage.run]
source = ["src/etl_processor", "src/ingester"]
