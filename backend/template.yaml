AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless ETL & Data Quality Platform - S3 -> SQS -> Lambda -> S3 + DynamoDB, with a DLQ,
  idempotent job claims, CloudWatch alarms, a React dashboard on Amplify Hosting with a
  read-only API (API Gateway + Lambda), and (V2) Parquet + Glue + Athena.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9]{1,10}$"
    Description: Suffix for resource names so several stages can coexist.
  AlertEmail:
    Type: String
    Default: ""
    Description: Email that receives alarm notifications (confirm the subscription email). Empty = no subscription.
  EnableAnalytics:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: V2 - write Parquet to curated/, create the Glue catalog and Athena workgroup.
  PandasLayerArn:
    Type: String
    # Source: https://aws-sdk-pandas.readthedocs.io/en/stable/layers.html (v3.17.1, python3.12 arm64, ap-south-1)
    Default: arn:aws:lambda:ap-south-1:336392948345:layer:AWSSDKPandas-Python312-Arm64:31
    Description: AWS-managed "AWS SDK for pandas" layer (provides pyarrow); used only when EnableAnalytics=true.
  MaxReceiveCount:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Deliveries before a message moves to the DLQ (the handler marks the job FAILED on the last one).

  IngestSchedule:
    Type: String
    Default: cron(30 6 * * ? *)
    Description: When the dataset-ingester fetches the public datasets (EventBridge Scheduler expression).
  IngestScheduleTimezone:
    Type: String
    Default: Asia/Kolkata
    Description: Time zone for IngestSchedule.
  IngestEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Turn the scheduled public-dataset ingestion on or off (on-demand runs always work).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  AnalyticsEnabled: !Equals [!Ref EnableAnalytics, "true"]
  IngestScheduleOn: !Equals [!Ref IngestEnabled, "true"]

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    DependsOn: JobQueuePolicy # S3 validates it can send to the queue when the notification is created
    Properties:
      BucketName: !Sub etl-pipeline-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-rejected
            Status: Enabled
            Prefix: rejected/
            ExpirationInDays: 30
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 30
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
          - Id: expire-noncurrent-and-incomplete
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt JobQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
                  - Name: suffix
                    Value: .csv

  # ---------------------------------------------------------------- queueing
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub etl-jobs-${Stage}
      VisibilityTimeout: 360 # >= 6x the 60 s Lambda timeout (AWS guidance for SQS event sources)
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDLQ.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  JobDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub etl-jobs-dlq-${Stage}
      MessageRetentionPeriod: 1209600 # 14 days to inspect and redrive
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:etl-jobs-${Stage}

  JobQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JobQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3BucketNotifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt JobQueue.Arn
            Condition:
              ArnLike:
                # Built with !Sub, not !GetAtt DataBucket.Arn, to avoid a circular dependency.
                aws:SourceArn: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------- job state
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub etl-jobs-${Stage}
      BillingMode: PROVISIONED # 5+5 RCU/WCU stays inside the always-free 25/25
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: started_at
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: started_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: false # AWS-owned key encryption (free) is always on

  # ---------------------------------------------------------------- compute
  EtlProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/etl-processor-${Stage}
      RetentionInDays: 14 # default is "never expire", which slowly costs money

  EtlProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      Description: etl-processor - reads raw/, writes output prefixes, owns job items. Nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: etl-processor-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/etl-processor-${Stage}:*
              - Sid: PollJobQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt JobQueue.Arn
              - Sid: ReadRawOnly
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion # jobs read the exact version named in the S3 event
                Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/raw/*
              - Sid: WriteOutputsOnly
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/processed/*
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/rejected/*
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/reports/*
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/curated/*
              - Sid: OwnJobItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem # claims and state changes are conditional UpdateItems
                Resource: !GetAtt JobsTable.Arn

  EtlProcessorFunction:
    Type: AWS::Serverless::Function
    DependsOn: EtlProcessorLogGroup
    Properties:
      FunctionName: !Sub etl-processor-${Stage}
      Description: Validates, cleans and reports on CSV files dropped in raw/<dataset>/
      CodeUri: src/
      Handler: etl_processor.app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt EtlProcessorRole.Arn
      Layers: !If [AnalyticsEnabled, [!Ref PandasLayerArn], !Ref AWS::NoValue]
      Environment:
        Variables:
          BUCKET_NAME: !Sub etl-pipeline-${AWS::AccountId}-${AWS::Region}
          TABLE_NAME: !Ref JobsTable
          SCHEMA_DIR: /var/task/schemas
          OUTPUT_FORMAT: !If [AnalyticsEnabled, both, csv]
          MAX_RECEIVE_COUNT: !Ref MaxReceiveCount
      Events:
        JobQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2 # caps parallelism without reserved concurrency

  # ---------------------------------------------------------------- automatic ingestion
  IngesterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/dataset-ingester-${Stage}
      RetentionInDays: 14

  IngesterRole:
    Type: AWS::IAM::Role
    Properties:
      Description: dataset-ingester - fetches public CSVs and writes them to raw/. Nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dataset-ingester-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/dataset-ingester-${Stage}:*
              - Sid: ReadAndWriteRawOnly
                Effect: Allow
                Action:
                  - s3:GetObject # HeadObject for change detection (sha256 metadata)
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/raw/*

  DatasetIngesterFunction:
    Type: AWS::Serverless::Function
    DependsOn: IngesterLogGroup
    Properties:
      FunctionName: !Sub dataset-ingester-${Stage}
      Description: Fetches the public CSV datasets in sources.json into raw/<dataset>/ when they change
      CodeUri: src/
      Handler: ingester.app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 120
      Role: !GetAtt IngesterRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Sub etl-pipeline-${AWS::AccountId}-${AWS::Region}
          SOURCES_FILE: /var/task/sources.json
      Events:
        DailyIngest:
          Type: ScheduleV2
          Properties:
            Name: !Sub dataset-ingest-${Stage}
            Description: Fetch the public datasets; unchanged sources are skipped
            ScheduleExpression: !Ref IngestSchedule
            ScheduleExpressionTimezone: !Ref IngestScheduleTimezone
            State: !If [IngestScheduleOn, ENABLED, DISABLED]
            RetryPolicy:
              MaximumRetryAttempts: 2 # safe: an unchanged source is skipped by its sha256

  # ---------------------------------------------------------------- alerts & monitoring
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub etl-pipeline-alerts-${Stage}
      DisplayName: ETL pipeline alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub etl-${Stage}-lambda-errors
      AlarmDescription: etl-processor crashed (timeout, OOM, init error or unhandled exception).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EtlProcessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub etl-${Stage}-dlq-not-empty
      AlarmDescription: A message exhausted its retries and is in the DLQ - a job FAILED.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub etl-${Stage}-queue-stuck
      AlarmDescription: The oldest job has waited over 10 minutes - the pipeline is stuck or throttled.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  IngesterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub etl-${Stage}-ingest-failed
      AlarmDescription: A scheduled or on-demand fetch of a public dataset failed (source down, too large, timeout).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DatasetIngesterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  PipelineDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub etl-pipeline-${Stage}
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
               "properties": {"markdown": "## Serverless ETL pipeline (${Stage})\nScheduler → ${IngesterName} → S3 raw/ → SQS ${QueueName} → Lambda ${FunctionName} → S3 outputs + DynamoDB ${JobsTable}. DLQ: ${DlqName}."}},
              {"type": "metric", "x": 0, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "Lambda invocations / errors / throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                 "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${FunctionName}"],
                             [".", "Errors", ".", "."],
                             [".", "Throttles", ".", "."]]}},
              {"type": "metric", "x": 8, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "Lambda duration p95 (ms)", "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                 "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${FunctionName}", {"stat": "p95"}],
                             ["...", {"stat": "Average"}]]}},
              {"type": "metric", "x": 16, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "Concurrent executions (capped at 2)", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                 "metrics": [["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${FunctionName}"]]}},
              {"type": "metric", "x": 0, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "Queue depth", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                 "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${QueueName}"],
                             [".", "ApproximateNumberOfMessagesNotVisible", ".", "."]]}},
              {"type": "metric", "x": 8, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "DLQ depth", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                 "annotations": {"horizontal": [{"label": "alarm", "value": 1}]},
                 "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DlqName}"]]}},
              {"type": "metric", "x": 16, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "Age of oldest message (s)", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                 "annotations": {"horizontal": [{"label": "alarm", "value": 600}]},
                 "metrics": [["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${QueueName}"]]}},
              {"type": "metric", "x": 0, "y": 14, "width": 8, "height": 6,
               "properties": {"title": "Rows accepted vs rejected", "region": "${AWS::Region}", "period": 300, "stat": "Sum", "view": "timeSeries", "stacked": true,
                 "metrics": [["EtlPipeline", "RowsAccepted", {"label": "accepted"}],
                             [".", "RowsRejected", {"label": "rejected"}]]}},
              {"type": "metric", "x": 8, "y": 14, "width": 8, "height": 6,
               "properties": {"title": "Job duration p95 (ms)", "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                 "metrics": [["EtlPipeline", "JobDurationMs", {"stat": "p95", "label": "p95"}]]}},
              {"type": "metric", "x": 16, "y": 14, "width": 8, "height": 6,
               "properties": {"title": "Jobs failed", "region": "${AWS::Region}", "period": 300, "stat": "Sum", "view": "timeSeries",
                 "metrics": [["EtlPipeline", "JobsFailed"]]}},
              {"type": "metric", "x": 0, "y": 28, "width": 24, "height": 5,
               "properties": {"title": "Public dataset ingestion (dataset-ingester)", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
                 "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${IngesterName}"],
                             [".", "Errors", ".", "."]]}},
              {"type": "log", "x": 0, "y": 20, "width": 24, "height": 8,
               "properties": {"title": "Recent jobs", "region": "${AWS::Region}", "view": "table",
                 "query": "SOURCE '${LogGroup}' | fields @timestamp, job_id, event, status, dataset, rows_accepted, rows_rejected, duration_ms, error_type | filter event in ['job_finished', 'job_failed', 'duplicate_delivery'] | sort @timestamp desc | limit 50"}}
            ]
          }
        - QueueName: !GetAtt JobQueue.QueueName
          DlqName: !GetAtt JobDLQ.QueueName
          FunctionName: !Ref EtlProcessorFunction
          IngesterName: !Ref DatasetIngesterFunction
          LogGroup: !Ref EtlProcessorLogGroup

  RecentJobsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub etl-pipeline-${Stage}/recent-jobs
      LogGroupNames:
        - !Ref EtlProcessorLogGroup
      QueryString: |
        fields @timestamp, job_id, event, status, dataset, rows_total, rows_accepted, rows_rejected, duration_ms, attempt, error_type
        | filter event in ["job_finished", "job_failed", "duplicate_delivery"]
        | sort @timestamp desc
        | limit 50

  JobTraceQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub etl-pipeline-${Stage}/job-trace
      LogGroupNames:
        - !Ref EtlProcessorLogGroup
      QueryString: |
        fields @timestamp, event, stage, status, receive_count, attempt, error_type, error_message
        | filter job_id = "REPLACE_WITH_JOB_ID"
        | sort @timestamp asc

  # ---------------------------------------------------------------- web: read-only API
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/etl-api-${Stage}
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      Description: etl-api - read-only access for the public website. Cannot write, upload or start anything.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: etl-api-read-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/etl-api-${Stage}:*
              - Sid: QueryJobsByStatus
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${JobsTable.Arn}/index/status-index
              - Sid: ReadOneJob
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt JobsTable.Arn
              - Sid: ReadReportsAndRejectedRows
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/reports/*
                  - !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/rejected/*
              - Sid: ReadQueueDepth
                Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource:
                  - !GetAtt JobQueue.Arn
                  - !GetAtt JobDLQ.Arn
              - !If
                - AnalyticsEnabled
                - Sid: AthenaSavedQueriesOnPipelineWorkgroup
                  Effect: Allow
                  Action:
                    - athena:StartQueryExecution
                    - athena:GetQueryExecution
                    - athena:GetQueryResults
                    - athena:StopQueryExecution
                    - athena:GetWorkGroup
                  Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/etl-pipeline-${Stage}
                - !Ref AWS::NoValue
              - !If
                - AnalyticsEnabled
                - Sid: GlueCatalogRead
                  Effect: Allow
                  Action:
                    - glue:GetDatabase
                    - glue:GetTable
                    - glue:GetPartition
                    - glue:GetPartitions
                  Resource:
                    - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                    - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/etl_pipeline_${Stage}
                    - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/etl_pipeline_${Stage}/sales
                - !Ref AWS::NoValue
              - !If
                - AnalyticsEnabled
                - Sid: AthenaReadsCuratedData # Athena reads S3 with the caller's permissions
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/curated/*
                - !Ref AWS::NoValue
              - !If
                - AnalyticsEnabled
                - Sid: AthenaWritesOwnResults
                  Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}/athena-results/*
                - !Ref AWS::NoValue
              - !If
                - AnalyticsEnabled
                - Sid: AthenaListsQueriedPrefixes
                  Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}
                  Condition:
                    StringLike:
                      s3:prefix:
                        - ""
                        - curated/*
                        - athena-results/*
                - !Ref AWS::NoValue
              - !If
                - AnalyticsEnabled
                - Sid: AthenaResolvesResultsBucket # GetBucketLocation has no s3:prefix key
                  Effect: Allow
                  Action: s3:GetBucketLocation
                  Resource: !Sub arn:aws:s3:::etl-pipeline-${AWS::AccountId}-${AWS::Region}
                - !Ref AWS::NoValue

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Read-only JSON API for the dashboard (reached through the Amplify site at /api/*)
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20 # protects DynamoDB's free 5 RCU from abuse
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub etl-api-${Stage}
      Description: Read-only JSON API behind the React dashboard
      CodeUri: src/
      Handler: api.app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 29
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          STAGE: !Ref Stage
          BUCKET_NAME: !Sub etl-pipeline-${AWS::AccountId}-${AWS::Region}
          TABLE_NAME: !Ref JobsTable
          QUEUE_URL: !Ref JobQueue
          DLQ_URL: !Ref JobDLQ
          INGEST_SCHEDULE_TEXT: !Sub "${IngestSchedule} (${IngestScheduleTimezone})"
          ATHENA_WORKGROUP: !If [AnalyticsEnabled, !Sub "etl-pipeline-${Stage}", ""]
          GLUE_DATABASE: !If [AnalyticsEnabled, !Sub "etl_pipeline_${Stage}", ""]
      Events:
        ApiRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/{proxy+}

  # ---------------------------------------------------------------- web: React site on Amplify Hosting
  SiteApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub etl-dashboard-${Stage}
      Description: React + Vite dashboard for the serverless ETL platform (manual deploys from frontend/dist)
      Platform: WEB
      CustomRules:
        # 1. Same-origin API: /api/* is reverse-proxied to API Gateway, so the browser never needs CORS.
        - Source: /api/<*>
          Target: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/<*>
          Status: "200"
        # 2. Client-side routes (/jobs/abc, /analytics) serve index.html; real files are served as-is.
        - Source: </^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|json|map|png|svg|txt|webp|woff|woff2)$)([^.]+$)/>
          Target: /index.html
          Status: "200"
      CustomHeaders: |
        customHeaders:
          - pattern: '**/*'
            headers:
              - key: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - key: X-Content-Type-Options
                value: nosniff
              - key: X-Frame-Options
                value: DENY
              - key: Referrer-Policy
                value: strict-origin-when-cross-origin
          - pattern: 'assets/**'
            headers:
              - key: Cache-Control
                value: public, max-age=31536000, immutable
          - pattern: 'index.html'
            headers:
              - key: Cache-Control
                value: no-cache

  SiteBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt SiteApp.AppId
      BranchName: main
      Stage: PRODUCTION
      EnableAutoBuild: false # deployed by scripts/deploy_frontend.py (zip of frontend/dist)
      Description: Production site

  # ---------------------------------------------------------------- V2 analytics (EnableAnalytics=true)
  GlueDatabase:
    Type: AWS::Glue::Database
    Condition: AnalyticsEnabled
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub etl_pipeline_${Stage}
        Description: Curated outputs of the serverless ETL pipeline

  SalesTable:
    Type: AWS::Glue::Table
    Condition: AnalyticsEnabled
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: sales
        Description: Clean sales rows as snappy Parquet. Partition projection - no crawler, no MSCK REPAIR.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          parquet.compression: SNAPPY
          projection.enabled: "true"
          projection.ingest_date.type: date
          projection.ingest_date.format: yyyy-MM-dd
          projection.ingest_date.range: 2026-01-01,NOW
          projection.ingest_date.interval: "1"
          projection.ingest_date.interval.unit: DAYS
          storage.location.template: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/curated/dataset=sales/ingest_date=${!ingest_date}/
        PartitionKeys:
          - Name: ingest_date
            Type: string
        StorageDescriptor:
          Location: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/curated/dataset=sales/
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: transaction_id, Type: string}
            - {Name: transaction_date, Type: date}
            - {Name: product_category, Type: string}
            - {Name: quantity, Type: bigint}
            - {Name: unit_price, Type: "decimal(18,2)"}
            - {Name: region, Type: string}
            - {Name: transaction_amount, Type: "decimal(18,2)"}

  SalesCsvTable:
    Type: AWS::Glue::Table
    Condition: AnalyticsEnabled
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: sales_csv
        Description: The same clean rows as CSV (processed/), kept to measure CSV vs Parquet bytes scanned.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.ingest_date.type: date
          projection.ingest_date.format: yyyy-MM-dd
          projection.ingest_date.range: 2026-01-01,NOW
          projection.ingest_date.interval: "1"
          projection.ingest_date.interval.unit: DAYS
          storage.location.template: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/processed/dataset=sales/ingest_date=${!ingest_date}/
        PartitionKeys:
          - Name: ingest_date
            Type: string
        StorageDescriptor:
          Location: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/processed/dataset=sales/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
          Columns:
            - {Name: transaction_id, Type: string}
            - {Name: transaction_date, Type: date}
            - {Name: product_category, Type: string}
            - {Name: quantity, Type: bigint}
            - {Name: unit_price, Type: "decimal(18,2)"}
            - {Name: region, Type: string}
            - {Name: transaction_amount, Type: "decimal(18,2)"}

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Condition: AnalyticsEnabled
    Properties:
      Name: !Sub etl-pipeline-${Stage}
      Description: ETL pipeline analytics - 100 MB per-query scan cap
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 104857600
        PublishCloudWatchMetricsEnabled: false
        ResultConfiguration:
          OutputLocation: !Sub s3://etl-pipeline-${AWS::AccountId}-${AWS::Region}/athena-results/
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  MonthlyRevenueQuery:
    Type: AWS::Athena::NamedQuery
    Condition: AnalyticsEnabled
    Properties:
      Name: monthly-revenue
      WorkGroup: !Ref AthenaWorkgroup
      Database: !Ref GlueDatabase
      QueryString: >
        SELECT date_format(transaction_date, '%Y-%m') AS month, SUM(transaction_amount) AS revenue,
        COUNT(*) AS transactions FROM sales GROUP BY 1 ORDER BY 1

  TopCategoriesQuery:
    Type: AWS::Athena::NamedQuery
    Condition: AnalyticsEnabled
    Properties:
      Name: top-10-categories
      WorkGroup: !Ref AthenaWorkgroup
      Database: !Ref GlueDatabase
      QueryString: >
        SELECT product_category, SUM(transaction_amount) AS revenue, SUM(quantity) AS units
        FROM sales GROUP BY 1 ORDER BY revenue DESC LIMIT 10

  RegionByMonthQuery:
    Type: AWS::Athena::NamedQuery
    Condition: AnalyticsEnabled
    Properties:
      Name: region-by-month
      WorkGroup: !Ref AthenaWorkgroup
      Database: !Ref GlueDatabase
      QueryString: >
        SELECT region, date_format(transaction_date, '%Y-%m') AS month,
        SUM(transaction_amount) AS revenue FROM sales GROUP BY 1, 2 ORDER BY 2, 3 DESC

Outputs:
  BucketName:
    Value: !Ref DataBucket
  QueueUrl:
    Value: !Ref JobQueue
  DlqUrl:
    Value: !Ref JobDLQ
  TableName:
    Value: !Ref JobsTable
  FunctionName:
    Value: !Ref EtlProcessorFunction
  IngesterFunctionName:
    Description: Invoke to fetch the public datasets now (scripts/ingest_now.py)
    Value: !Ref DatasetIngesterFunction
  LogGroupName:
    Value: !Ref EtlProcessorLogGroup
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  SiteUrl:
    Description: The React dashboard (Amplify Hosting)
    Value: !Sub https://main.${SiteApp.DefaultDomain}
  SiteAppId:
    Description: Amplify app that scripts/deploy_frontend.py deploys to
    Value: !GetAtt SiteApp.AppId
  ApiEndpoint:
    Description: Direct API Gateway URL (the site uses the same API at /api/* through Amplify)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CloudWatchDashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/etl-pipeline-${Stage}
  AthenaWorkgroupName:
    Condition: AnalyticsEnabled
    Value: !Ref AthenaWorkgroup
  GlueDatabaseName:
    Condition: AnalyticsEnabled
    Value: !Ref GlueDatabase
